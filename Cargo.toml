[package]
name = "si-runtime-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly runtime for constraint-aware AI — conservation budgets, spectral ranking, capability discovery"
license = "MIT"
repository = "https://github.com/SuperInstance/si-runtime-wasm"
authors = ["SuperInstance Contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
